name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install lightweight audit dependencies
        run: pip install numpy pyyaml
      - name: Compile Python sources
        run: python -m compileall -q dahp scripts
      - name: Validate released result summaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          main = json.loads(Path("results/eval/paper_results_public.json").read_text())
          assert main["missing_sources"] == []
          assert len(main["evaluation_results"]) == 40
          assert main["early_signal_analysis"]["analysis"] == "retrospective_early_signal"

          for name in ("profile_threshold_sensitivity", "uavdt_threshold_sensitivity"):
              audit = json.loads(Path(f"results/eval/{name}.json").read_text())
              assert len(audit["rows"]) == 12
          PY
      - name: Verify manuscript numbers
        run: python scripts/verify_paper_numbers.py
